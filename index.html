<!DOCTYPE html>
<html>
<head>
    <title>Latest Streamer News</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .article {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 12px;
        }

        .article a {
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
        }

        .source {
            color: #777;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<h1>Latest Streamer News</h1>

<div class="article">
    <a href="https://example.com">Example Streamer News Article</a>
    <div class="source">Example News · 1 hour ago</div>
</div>

<div class="article">
    <a href="https://example.com">Another Streamer Update</a>
    <div class="source">Example News · 2 hours ago</div>
</div>

</body>
</html>
