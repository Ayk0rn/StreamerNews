<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Latest Streamer News</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: auto;
            padding: 30px 20px;
            background: #f4f4f4;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .article {
            background: white;
            padding: 22px;
            margin-bottom: 18px;
            border-radius: 12px;
        }

        .article h2 {
            margin-top: 0;
        }

        .article h2 a {
            color: #111;
            text-decoration: none;
        }

        .article h2 a:hover {
            text-decoration: underline;
        }

        .date {
            color: #777;
            font-size: 14px;
        }

        .read {
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

</body>
</html>
